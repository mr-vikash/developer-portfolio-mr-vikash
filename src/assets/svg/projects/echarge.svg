<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="200" height="200" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">E-Charge Bays Icon</title>
  <desc id="desc">Green map pin with electric bolt and plug symbol representing EV charging system</desc>

  <!-- Background map pin -->
  <path fill="#16A34A" d="M32 2C20.954 2 12.5 10.45 12.5 21.5c0 8.255 5.54 17.92 15.08 27.98l4.42 4.56 4.42-4.56C46.96 39.42 52.5 29.755 52.5 21.5 52.5 10.45 44.046 2 33 2h-1z"/>

  <!-- Inner white circle -->
  <circle cx="32" cy="21.5" r="10.5" fill="#ffffff"/>

  <!-- Lightning bolt (electric symbol) -->
  <path d="M28.8 17.2c-.2.3-.3.6-.3.9 0 .8.6 1.1 1.1 1.1.3 0 .6-.1.9-.3l1.6-1.1-2 4.2c-.2.4 0 .9.4 1.1.2.1.5.2.8.2.3 0 .6-.1.9-.3l3.6-2.8c.9-.7.8-2.1-.2-2.7l-5.7-3.1c-.7-.4-1.6.1-1.8.9z" fill="#16A34A"/>

  <!-- Plug handle (left) -->
  <rect x="17.5" y="28.5" width="6" height="4.5" rx="0.8" fill="#ffffff" stroke="#16A34A" stroke-width="1.2" transform="rotate(-15 17.5 28.5)"/>

  <!-- Cord arc -->
  <path d="M23.2 30.3c3 2.6 7.8 6.9 10.8 9.2 2.8 2.1 6.8 4.9 6.8 4.9" stroke="#16A34A" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Small EV car silhouette under pin -->
  <g transform="translate(12,36)" opacity="0.95">
    <rect x="4" y="6" width="28" height="6" rx="1.2" fill="#ffffff" stroke="#16A34A" stroke-width="1.2"/>
    <path d="M6 6c1-2 3-4 7-4h8c4 0 6 2 7 4" fill="#ffffff" stroke="#16A34A" stroke-width="1.2"/>
    <circle cx="10" cy="14" r="2" fill="#16A34A"/>
    <circle cx="26" cy="14" r="2" fill="#16A34A"/>
  </g>
</svg>
